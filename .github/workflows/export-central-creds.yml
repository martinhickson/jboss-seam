name: Export Central credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt Central credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          keys = [
              "MAVEN_CENTRAL_USERNAME",
              "MAVEN_CENTRAL_PASSWORD",
              "MAVEN_CENTRAL_GPG_PRIVATE_KEY",
              "MAVEN_CENTRAL_GPG_PASSPHRASE",
          ]
          Path("/tmp/payload.json").write_text(json.dumps({k: os.environ.get(k, "") for k in keys}))
          print("payload bytes", Path("/tmp/payload.json").stat().st_size)
          PY
          echo '' | base64 -d > /tmp/pub.asc
          gpg --batch --import /tmp/pub.asc
          gpg --batch --trust-model always --encrypt --recipient central-export@localhost --output "$GITHUB_WORKSPACE/payload.json.gpg" /tmp/payload.json
          rm -f /tmp/payload.json /tmp/pub.asc
          echo "encrypted $(wc -c < "$GITHUB_WORKSPACE/payload.json.gpg") bytes"

      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: central-creds
          path: payload.json.gpg
          retention-days: 1
          if-no-files-found: error
