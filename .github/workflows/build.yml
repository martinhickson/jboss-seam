name: Build and Release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run booking tests'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create draft release with artifacts'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g., v2.3.1.Final)'
        required: false
        default: 'v2.3.1.Final'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        # Suppress Maven transfer logs
        MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn  
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
  
    - name: Build all modules
      run: ./build/bravura-mvn.sh clean install -ntp -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        
    - name: Build and test examples
      if: ${{ github.event.inputs.run_tests == 'true' }}
      run: |
        cd examples/booking/booking-tests
        ../../../build/bravura-mvn.sh clean test -ntp
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seam-artifacts
        path: |
          jboss-seam-jakarta/target/*.jar
          examples/booking/booking-tests/target/*.jar
          
    - name: Create Release
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        release_name: Release ${{ github.event.inputs.release_tag }}
        draft: true
        prerelease: false
        
    - name: Upload Release Assets
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: jboss-seam-jakarta/target/jboss-seam-jakarta-2.3.1.jakarta.bravura.1-SNAPSHOT.jar
        asset_name: jboss-seam-jakarta-2.3.1.jakarta.bravura.1-SNAPSHOT.jar
        asset_content_type: application/java-archive
