name: Build and Release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run booking tests'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create draft release with artifacts'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (e.g., v2.3.1.Final)'
        required: false
        default: 'v2.3.1.Final'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        # Suppress Maven transfer logs; CDK plugin needs JDK module opens on Java 17+
        MAVEN_OPTS: >-
          -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          --add-opens=java.base/java.lang=ALL-UNNAMED
          --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
          --add-opens=java.base/java.io=ALL-UNNAMED
          --add-opens=java.base/java.security=ALL-UNNAMED
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Configure Maven for Bravura GitHub Packages
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                      http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github-packages</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-richfaces</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-richfaces-core</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-cdk</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-el</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>ci-extra-repositories</id>
              <repositories>
                <repository>
                  <id>jboss-public</id>
                  <name>JBoss Public Repository Group</name>
                  <url>https://repository.jboss.org/nexus/content/groups/public</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>jboss-public</id>
                  <name>JBoss Public Repository Group</name>
                  <url>https://repository.jboss.org/nexus/content/groups/public</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
            <profile>
              <id>bravura-extra-repos</id>
              <repositories>
                <repository>
                  <id>github-packages-richfaces</id>
                  <name>Bravura RichFaces (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>github-packages-richfaces-core</id>
                  <name>Bravura RichFaces Core (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces4-core</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>github-packages-cdk</id>
                  <name>Bravura RichFaces CDK (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces-cdk</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>github-packages-el</id>
                  <name>Bravura JBoss EL (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/jboss-el</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>github-packages-richfaces</id>
                  <name>Bravura RichFaces (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>github-packages-richfaces-core</id>
                  <name>Bravura RichFaces Core (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces4-core</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>github-packages-cdk</id>
                  <name>Bravura RichFaces CDK (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces-cdk</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>github-packages-el</id>
                  <name>Bravura JBoss EL (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/jboss-el</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>ci-extra-repositories</activeProfile>
            <activeProfile>bravura-extra-repos</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        sed -i "s|MAVEN_GITHUB_ACTOR|${GITHUB_ACTOR}|g; s|MAVEN_GITHUB_TOKEN|${GITHUB_TOKEN}|g" ~/.m2/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
  
    - name: Build all modules
      run: mvn clean install -ntp -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and test examples
      if: ${{ github.event.inputs.run_tests == 'true' }}
      run: |
        cd examples/booking/booking-tests
        mvn clean test -ntp
        cd ../booking-ejb-tests
        mvn clean test -ntp
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: seam-artifacts
        path: |
          jboss-seam-jakarta/target/*.jar
          examples/booking/booking-tests/target/*.jar
          
    - name: Create Release
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        release_name: Release ${{ github.event.inputs.release_tag }}
        draft: true
        prerelease: false
        
    - name: Upload Release Assets
      if: ${{ github.event.inputs.create_release == 'true' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: jboss-seam-jakarta/target/jboss-seam-jakarta-2.3.1.jakarta.bravura.1-SNAPSHOT.jar
        asset_name: jboss-seam-jakarta-2.3.1.jakarta.bravura.1-SNAPSHOT.jar
        asset_content_type: application/java-archive
