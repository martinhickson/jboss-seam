name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 2.4.1-bravura-31)'
        required: true
        type: string
      run_integration_tests:
        description: 'Run Seam WildFly integration tests'
        required: false
        default: false
        type: boolean
      deploy_to_maven_central:
        description: 'Also publish to Maven Central (io.github.martinhickson)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Suppress Maven transfer logs; CDK plugin needs JDK module opens on Java 17+
      MAVEN_OPTS: >-
        -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.security=ALL-UNNAMED
      RELEASE_VERSION: ${{ github.event.inputs.release_version }}
      BRANCH_NAME: v${{ github.event.inputs.release_version }}
      TAG_NAME: v${{ github.event.inputs.release_version }}-release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Create release branch
      run: |
        git checkout -b ${{ env.BRANCH_NAME }}
        echo "Created branch: ${{ env.BRANCH_NAME }}"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Update versions in all POM files
      run: |
        # Set the project version (updates root pom.xml and all parent references in child POMs)
        mvn versions:set -DnewVersion=${RELEASE_VERSION} -DprocessAllModules -DgenerateBackupPoms=false

        # Update the version.seam property in root pom.xml using sed (simple and reliable)
        sed -i "s|<version.seam>.*</version.seam>|<version.seam>${RELEASE_VERSION}</version.seam>|" pom.xml

        echo "Version update completed"
      env:
        RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

    - name: Verify version updates
      run: |
        echo "Verifying version updates..."
        echo "Root POM version:"
        grep -A 2 "<artifactId>seam-parent</artifactId>" pom.xml | grep "<version>" || grep -A 1 "<artifactId>seam-parent</artifactId>" pom.xml
        echo ""
        echo "GroupId:"
        grep -m1 "<groupId>" pom.xml
        echo ""
        echo "Version.seam property:"
        grep "version.seam" pom.xml | head -1
        echo ""
        echo "Sample child POM parent version:"
        grep -A 2 "seam-parent" jboss-seam-jakarta/pom.xml | grep "<version>" || grep -A 1 "seam-parent" jboss-seam-jakarta/pom.xml

    - name: Commit and push version changes
      run: |
        git add -A
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Release version ${RELEASE_VERSION}"
          git push origin "${BRANCH_NAME}"
        fi

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Configure Maven for Bravura GitHub Packages
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                      http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>github-packages</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-richfaces</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-richfaces-core</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-cdk</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
            <server>
              <id>github-packages-el</id>
              <username>MAVEN_GITHUB_ACTOR</username>
              <password>MAVEN_GITHUB_TOKEN</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>ci-extra-repositories</id>
              <repositories>
                <repository>
                  <id>jboss-public</id>
                  <name>JBoss Public Repository Group</name>
                  <url>https://repository.jboss.org/nexus/content/groups/public</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>jboss-public</id>
                  <name>JBoss Public Repository Group</name>
                  <url>https://repository.jboss.org/nexus/content/groups/public</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
            <profile>
              <id>bravura-extra-repos</id>
              <repositories>
                <repository>
                  <id>github-packages-richfaces</id>
                  <name>Bravura RichFaces (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>github-packages-richfaces-core</id>
                  <name>Bravura RichFaces Core (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces4-core</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>github-packages-cdk</id>
                  <name>Bravura RichFaces CDK (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces-cdk</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
                <repository>
                  <id>github-packages-el</id>
                  <name>Bravura JBoss EL (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/jboss-el</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>github-packages-richfaces</id>
                  <name>Bravura RichFaces (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>github-packages-richfaces-core</id>
                  <name>Bravura RichFaces Core (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces4-core</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>github-packages-cdk</id>
                  <name>Bravura RichFaces CDK (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/richfaces-cdk</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
                <pluginRepository>
                  <id>github-packages-el</id>
                  <name>Bravura JBoss EL (GitHub Packages)</name>
                  <url>https://maven.pkg.github.com/martinhickson/jboss-el</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>true</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>ci-extra-repositories</activeProfile>
            <activeProfile>bravura-extra-repos</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        sed -i "s|MAVEN_GITHUB_ACTOR|${GITHUB_ACTOR}|g; s|MAVEN_GITHUB_TOKEN|${GITHUB_TOKEN}|g" ~/.m2/settings.xml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}

    - name: Build all modules
      run: mvn clean install -ntp -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run integration tests
      if: ${{ github.event.inputs.run_integration_tests == 'true' }}
      run: |
        mvn -pl seam-integration-tests -ntp test \
          -Darquillian=wildfly-managed-36 \
          -DfailIfNoTests=false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create and push tag
      run: |
        git tag -a "${TAG_NAME}" -m "Release ${RELEASE_VERSION}"
        git push origin "${TAG_NAME}"

    - name: Publish to GitHub Packages
      run: |
        mvn deploy -ntp -DskipTests \
          -DaltDeploymentRepository=github-packages::default::https://maven.pkg.github.com/${{ github.repository }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate Maven Central configuration
      if: ${{ github.event.inputs.deploy_to_maven_central == 'true' }}
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
      run: |
        if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ] || [ -z "$MAVEN_CENTRAL_GPG_PRIVATE_KEY" ]; then
          echo "::error::Maven Central publishing is not configured for this repository."
          echo "Add secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_CENTRAL_GPG_PRIVATE_KEY, MAVEN_CENTRAL_GPG_PASSPHRASE"
          exit 1
        fi

    - name: Configure Maven Central credentials
      if: ${{ github.event.inputs.deploy_to_maven_central == 'true' }}
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      run: |
        sed -i "/<\/servers>/i\\
            <server>\\
              <id>central</id>\\
              <username>${MAVEN_CENTRAL_USERNAME}</username>\\
              <password>${MAVEN_CENTRAL_PASSWORD}</password>\\
            </server>" ~/.m2/settings.xml

    - name: Import GPG signing key
      if: ${{ github.event.inputs.deploy_to_maven_central == 'true' }}
      env:
        MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
      run: |
        echo "${MAVEN_CENTRAL_GPG_PRIVATE_KEY}" | gpg --batch --import --pinentry-mode loopback

    - name: Prepare POMs for Maven Central
      if: ${{ github.event.inputs.deploy_to_maven_central == 'true' }}
      run: |
        SCM_TAG="v${{ github.event.inputs.release_version }}-release"
        echo "Setting SCM tag to ${SCM_TAG}"
        mvn -ntp versions:set-scm-tag -DnewTag="${SCM_TAG}" -DgenerateBackupPoms=false || \
          sed -i "s|<tag>.*</tag>|<tag>${SCM_TAG}</tag>|" pom.xml

    - name: Publish to Maven Central
      if: ${{ github.event.inputs.deploy_to_maven_central == 'true' }}
      run: |
        # Publish only the library modules consumers need (skip ITs / examples reactor noise)
        # Quote -pl so bash does not treat ! as history expansion. Exclude reactor
        # siblings pulled in via -am (cdk plugin / legacy javax modules).
        mvn deploy -ntp -Pcentral-release -DskipTests \
          -pl 'bom,jboss-seam-jakarta,jboss-seam-ui-jakarta,jboss-seam-pdf-jakarta,jboss-seam-rss-jakarta,!seam-cdk-helper,!jboss-seam,!jboss-seam-ui,!jboss-seam-pdf,!jboss-seam-rss,!jboss-seam-debug,!jboss-seam-gen,!jboss-seam-ioc,!jboss-seam-mail,!jboss-seam-remoting,!jboss-seam-resteasy,!jboss-seam-excel,!jboss-seam-flex,!jboss-seam-wicket,!seam-integration-tests' \
          -am \
          -Dsortpom.skip=true \
          -Dgpg.passphrase="${MAVEN_CENTRAL_GPG_PASSPHRASE}"
      env:
        MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts-${{ github.event.inputs.release_version }}
        path: |
          **/target/*.jar
          **/target/*.war
          **/target/*.ear
        retention-days: 30
        if-no-files-found: warn

    - name: Prepare GitHub release notes
      run: |
        {
          echo "RELEASE_BODY<<EOF"
          echo "Release ${RELEASE_VERSION}"
          echo ""
          echo "Maven coordinates: \`io.github.martinhickson\` (same namespace as webstart-maven-plugin)"
          echo ""
          echo "This release includes:"
          echo "- Maven artifacts published to GitHub Packages"
          if [ "${{ github.event.inputs.deploy_to_maven_central }}" = "true" ]; then
            echo "- Maven artifacts published to Maven Central"
          fi
          echo "- Release branch: ${BRANCH_NAME}"
          echo "- Tag: ${TAG_NAME}"
          echo ""
          echo "Install with:"
          echo '```xml'
          echo "<dependency>"
          echo "  <groupId>io.github.martinhickson</groupId>"
          echo "  <artifactId>jboss-seam-jakarta</artifactId>"
          echo "  <version>${RELEASE_VERSION}</version>"
          echo "</dependency>"
          echo '```'
          echo "EOF"
        } >> "${GITHUB_ENV}"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: Release ${{ env.RELEASE_VERSION }}
        body: ${{ env.RELEASE_BODY }}
        draft: false
        prerelease: false
        files: |
          **/target/*.jar
          **/target/*.war
          **/target/*.ear
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
